
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club de las Despechadas</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background: #170016;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #ff4fa3; }
    #reader {
      max-width: 400px;
      margin: 20px auto;
      background: white;
      color: black;
    }
    #resultado {
      padding: 22px;
      margin: 15px auto;
      max-width: 400px;
      border-radius: 15px;
      background: #333;
      font-size: 21px;
      font-weight: bold;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    button {
      display: block;
      background: #ff4fa3;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      margin: 15px auto;
      width: 100%;
      max-width: 400px;
      cursor: pointer;
    }
    #control { display: none; }
  </style>
</head>
<body>
  <h1>💖 CLUB DE LAS DESPECHADAS</h1>
  <h2>Control de entradas 🎟️</h2>

  <div id="acceso">
    <p>Ingresá con tu cuenta autorizada.</p>
    <button id="entrar">🔐 INGRESAR CON GOOGLE</button>
    <p id="mensaje"></p>
  </div>

  <div id="control">
    <p id="usuario"></p>
    <div id="reader"></div>
    <div id="resultado">Esperando QR...</div>
    <button id="siguiente">🔄 SIGUIENTE ENTRADA</button>
    <button id="salir">Cerrar sesión</button>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      runTransaction,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCReqv35YIIDAN6ys5nUxkHszZLmuQXpS8",
      authDomain: "club-despechadas-entradas.firebaseapp.com",
      projectId: "club-despechadas-entradas",
      storageBucket: "club-despechadas-entradas.firebasestorage.app",
      messagingSenderId: "101212438318",
      appId: "1:101212438318:web:56f743240a572899a204bf",
      measurementId: "G-57X9VZK52N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const proveedor = new GoogleAuthProvider();

    const autorizadas = [
      "elclubdelas.despechadas1@gmail.com",
      "laugabrielli1987@gmail.com"
    ];

    let scanner = null;
    let procesando = false;

    function mostrar(texto, color = "#333") {
      const resultado = document.getElementById("resultado");
      resultado.textContent = texto;
      resultado.style.background = color;
    }

    document.getElementById("entrar").onclick = async () => {
      try {
        await signInWithPopup(auth, proveedor);
      } catch (error) {
        if (
          error.code === "auth/popup-blocked" ||
          error.code === "auth/operation-not-supported-in-this-environment"
        ) {
          await signInWithRedirect(auth, proveedor);
        } else {
          document.getElementById("mensaje").textContent =
            "Error al ingresar: " + error.message;
        }
      }
    };

    getRedirectResult(auth).catch(error => {
      document.getElementById("mensaje").textContent =
        "Error de acceso: " + error.message;
    });

    document.getElementById("salir").onclick = () => signOut(auth);

    document.getElementById("siguiente").onclick = () => {
      procesando = false;
      mostrar("Esperando QR...");
    };

    async function validarQR(codigo) {
      if (procesando) return;
      procesando = true;

      mostrar("Verificando entrada...", "#555");

      try {
        const referencia = doc(db, "entradas", codigo.trim());

        const resultado = await runTransaction(db, async transaccion => {
          const entrada = await transaccion.get(referencia);

          if (!entrada.exists()) {
            return { estado: "INVALIDA" };
          }

          const datos = entrada.data();

          if (datos.estado === "UTILIZADA") {
            return {
              estado: "USADA",
              nombre: datos.nombre || ""
            };
          }

          if (datos.estado !== "DISPONIBLE") {
            return { estado: "INVALIDA" };
          }

          transaccion.update(referencia, {
            estado: "UTILIZADA",
            fechaIngreso: serverTimestamp()
          });

          return {
            estado: "OK",
            nombre: datos.nombre || ""
          };
        });

        if (resultado.estado === "OK") {
          mostrar(
            "✅ ENTRADA VÁLIDA\n\n" + resultado.nombre,
            "#167a35"
          );
        } else if (resultado.estado === "USADA") {
          mostrar(
            "❌ ENTRADA YA UTILIZADA\n\n" + resultado.nombre,
            "#b91c1c"
          );
        } else {
          mostrar("❌ QR NO VÁLIDO", "#b91c1c");
        }

      } catch (error) {
        mostrar(
          "⚠️ NO SE PUDO VALIDAR\n\n" +
          "No permitas el ingreso hasta comprobarlo.\n\n" +
          error.message,
          "#9a6700"
        );
      }
    }

    onAuthStateChanged(auth, async usuario => {
      const correo = usuario?.email?.toLowerCase();

      if (!usuario || !autorizadas.includes(correo)) {
        document.getElementById("acceso").style.display = "block";
        document.getElementById("control").style.display = "none";

        if (scanner) {
          try { await scanner.clear(); } catch (e) {}
          scanner = null;
        }

        procesando = false;

        if (usuario) {
          document.getElementById("mensaje").textContent =
            "Esta cuenta no está autorizada.";
          await signOut(auth);
        }
        return;
      }

      document.getElementById("acceso").style.display = "none";
      document.getElementById("control").style.display = "block";
      document.getElementById("usuario").textContent =
        "Sesión: " + correo;

      if (!scanner) {
        scanner = new Html5QrcodeScanner(
          "reader",
          { fps: 10, qrbox: 250 },
          false
        );

        scanner.render(
          codigo => validarQR(codigo),
          () => {}
        );
      }
    });
  </script>
</body>
</html>
